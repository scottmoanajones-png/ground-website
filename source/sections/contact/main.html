<section class="page-hero section" aria-labelledby="contact-title">
  <div class="shell">
    <div class="page-hero-inner" data-reveal>
      <p class="eyebrow">Contact</p>
      <h1 id="contact-title">Let's talk</h1>
      <p class="page-hero-body">And build on solid Ground.</p>
    </div>
  </div>
</section>

<section class="contact-form-section section">
  <div class="shell">
    <div class="contact-grid">
      <form class="contact-form" action="mailto:clients@groundtech.co" method="post" enctype="text/plain" novalidate>
        <div class="form-field">
          <label for="contact-name">Name</label>
          <input type="text" id="contact-name" name="name" required autocomplete="name">
        </div>
        <div class="form-field">
          <label for="contact-email">Email</label>
          <input type="email" id="contact-email" name="email" required autocomplete="email">
        </div>
        <div class="form-field">
          <label for="contact-company">Company</label>
          <input type="text" id="contact-company" name="company" autocomplete="organization">
        </div>
        <div class="form-field">
          <label for="contact-message">How can we help?</label>
          <textarea id="contact-message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="button button-light contact-submit">Send message</button>
      </form>

      <div class="contact-info" data-reveal style="--delay: 100ms">
        <div class="contact-info-block">
          <p class="eyebrow">Email</p>
          <a href="mailto:clients@groundtech.co" class="contact-email">clients@groundtech.co</a>
        </div>
        <div class="contact-info-block">
          <p class="eyebrow">Follow us</p>
          <div class="contact-socials">
            <a href="https://x.com/ground_onchain" target="_blank" rel="noopener">X</a>
            <a href="https://www.linkedin.com/company/ground-global" target="_blank" rel="noopener">LinkedIn</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
