<section class="section platform-section" id="platforms">
      <div class="shell platform-shell">
        <div class="platform-callout" data-reveal style="--delay: 90ms;">
          <div class="platform-head">
            <p class="eyebrow">Designed for every kind of platform</p>
            <h2>Connect your platform to the full on-chain yield grid &mdash; liquid, instant, always available.</h2>
          </div>

          <div class="platform-grid">
            <div class="platform-groups">
              <button class="platform-group is-active" type="button" data-platform-scene="0" data-platform-key="consumer" aria-pressed="true">
                <div class="platform-group-head">
                  <div class="platform-group-pip"></div>
                  <span class="platform-group-label">Consumer Platforms</span>
                </div>
                <div class="platform-group-chips">
                  <span class="platform-chip">Banks</span>
                  <span class="platform-chip">Neobanks</span>
                  <span class="platform-chip">Wallets</span>
                  <span class="platform-chip">Fintechs</span>
                </div>
              </button>

              <button class="platform-group" type="button" data-platform-scene="1" data-platform-key="infrastructure" aria-pressed="false">
                <div class="platform-group-head">
                  <div class="platform-group-pip"></div>
                  <span class="platform-group-label">Market Infrastructure</span>
                </div>
                <div class="platform-group-chips">
                  <span class="platform-chip">Exchanges</span>
                  <span class="platform-chip">Custodians</span>
                </div>
              </button>

              <button class="platform-group" type="button" data-platform-scene="2" data-platform-key="institutions" aria-pressed="false">
                <div class="platform-group-head">
                  <div class="platform-group-pip"></div>
                  <span class="platform-group-label">Capital &amp; Institutions</span>
                </div>
                <div class="platform-group-chips">
                  <span class="platform-chip">Corporate Treasuries</span>
                  <span class="platform-chip">Investment &amp; Wealth Managers</span>
                </div>
              </button>
            </div>

            <div class="platform-visual-wrap">
              <div class="platform-visual-shell" data-platform-atlas data-platform-active="consumer" aria-hidden="true">
                <div class="platform-visual">
                  <canvas id="platformScene"></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
