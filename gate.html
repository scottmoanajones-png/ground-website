  <title>Ground — Private Preview</title>

</head>
<body>
  <section class="gate">
  <a class="gate-brand" href="#" aria-label="Ground">
    <svg class="gate-mark" width="1151" height="240" viewBox="0 0 1151 240" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <path d="M431 96H335V168H407V144H359V120H431V192H311V72H431V96ZM575 144H527V168H575V192H503V120H551V96H479V192H455V72H575V144ZM719 192H599V72H719V192ZM767 168H839V72H863V192H743V72H767V168ZM1007 192H983V96H911V192H887V72H1007V192ZM1151 192H1031V120H1055V168H1127V96H1031V72H1151V192ZM623 168H695V96H623V168Z" fill="currentColor"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M240 240H0V0H240V240ZM96 168V192H144V168H96ZM72 144H168V120H72V144ZM48 96H192V72H48V96Z" fill="currentColor"/>
    </svg>
  </a>
  <form class="gate-form" id="gate-form" onsubmit="return false;">
    <p class="gate-label">This preview is private. Enter the access code to continue.</p>
    <div class="gate-field">
      <input
        class="gate-input"
        id="gate-input"
        type="password"
        placeholder="Access code"
        autocomplete="off"
        spellcheck="false"
        aria-label="Access code"
      >
      <button class="gate-submit" type="submit" id="gate-submit">Enter</button>
    </div>
    <p class="gate-error" id="gate-error" aria-live="polite"></p>
  </form>
</section>

<script>
  (function () {
    var PW = "apple-banana-cherry";
    var input = document.getElementById("gate-input");
    var error = document.getElementById("gate-error");
    document.getElementById("gate-form").addEventListener("submit", function () {
      if (input.value === PW) {
        sessionStorage.setItem("gnd_auth", "1");
        location.replace("index.html");
      } else {
        error.textContent = "Incorrect access code.";
        input.value = "";
        input.focus();
      }
    });
    document.getElementById("gate-submit").addEventListener("click", function () {
      document.getElementById("gate-form").dispatchEvent(new Event("submit"));
    });
  })();
</script>
